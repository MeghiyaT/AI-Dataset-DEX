# fly.toml for Midnight Proof Server on Fly.io
# Deploys midnightntwrk/proof-server with 1GB RAM to handle ZK-SNARK proving

app = 'midnight-proof-server-dex'
primary_region = 'iad'

[build]
  image = 'midnightntwrk/proof-server:latest'

[http_service]
  internal_port = 6300
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
